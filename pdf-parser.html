<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF 结构化解析器</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --card: #ffffff;
        --primary: #2563eb;
        --border: #dbe3f1;
        --text: #1f2937;
        --muted: #6b7280;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .app {
        max-width: 1100px;
        margin: 0 auto;
        display: grid;
        gap: 16px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      .desc {
        margin: 0;
        color: var(--muted);
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }

      .btn,
      .file-label {
        border: none;
        border-radius: 10px;
        padding: 10px 14px;
        cursor: pointer;
        font-size: 14px;
      }

      .file-label {
        background: #eef2ff;
        color: #3730a3;
        border: 1px solid #c7d2fe;
      }

      .btn {
        background: var(--primary);
        color: white;
      }

      .btn:disabled {
        background: #93c5fd;
        cursor: not-allowed;
      }

      input[type="file"] {
        display: none;
      }

      .status {
        color: var(--muted);
        font-size: 14px;
      }

      .layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .pane-title {
        margin: 0 0 10px;
        font-size: 16px;
      }

      textarea,
      pre {
        width: 100%;
        min-height: 380px;
        margin: 0;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        font-size: 13px;
        line-height: 1.5;
        background: #fbfcff;
        white-space: pre-wrap;
        overflow: auto;
      }

      textarea { resize: vertical; }

      @media (max-width: 900px) {
        .layout { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="card">
        <h1>PDF 结构化解析器（单页面）</h1>
        <p class="desc">上传 PDF 后，自动提取文本并尝试识别：键值对、表格行以及页级内容，最终输出可复制的 JSON。</p>
      </div>

      <div class="card">
        <div class="actions">
          <label class="file-label" for="pdfInput">选择 PDF</label>
          <input id="pdfInput" type="file" accept="application/pdf" />
          <button id="parseBtn" class="btn" disabled>解析并生成结构化数据</button>
          <button id="downloadBtn" class="btn" disabled>下载 JSON</button>
          <span id="status" class="status">请先选择 PDF 文件。</span>
        </div>
      </div>

      <div class="layout">
        <div class="card">
          <h2 class="pane-title">原始文本预览</h2>
          <textarea id="rawText" placeholder="解析后显示 PDF 文本..." readonly></textarea>
        </div>
        <div class="card">
          <h2 class="pane-title">结构化 JSON</h2>
          <pre id="jsonOutput">{}</pre>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.8.69/pdf.min.mjs" type="module"></script>
    <script type="module">
      import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.8.69/pdf.min.mjs";

      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.8.69/pdf.worker.min.mjs";

      const pdfInput = document.getElementById("pdfInput");
      const parseBtn = document.getElementById("parseBtn");
      const downloadBtn = document.getElementById("downloadBtn");
      const statusEl = document.getElementById("status");
      const rawTextEl = document.getElementById("rawText");
      const jsonOutputEl = document.getElementById("jsonOutput");

      let selectedFile = null;
      let lastJson = null;

      const setStatus = (text) => {
        statusEl.textContent = text;
      };

      pdfInput.addEventListener("change", (e) => {
        selectedFile = e.target.files?.[0] || null;
        parseBtn.disabled = !selectedFile;
        downloadBtn.disabled = true;
        if (selectedFile) {
          setStatus(`已选择：${selectedFile.name}`);
        } else {
          setStatus("请先选择 PDF 文件。");
        }
      });

      parseBtn.addEventListener("click", async () => {
        if (!selectedFile) return;
        parseBtn.disabled = true;
        downloadBtn.disabled = true;
        setStatus("解析中，请稍候...");

        try {
          const arrayBuffer = await selectedFile.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

          const pages = [];
          const allLines = [];

          for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            const page = await pdf.getPage(pageNum);
            const text = await page.getTextContent();
            const lines = text.items
              .map((item) => (item.str || "").trim())
              .filter(Boolean);

            pages.push({ pageNumber: pageNum, lines });
            allLines.push(...lines);
          }

          const keyValues = extractKeyValues(allLines);
          const tables = extractTableLikeRows(allLines);

          const result = {
            metadata: {
              fileName: selectedFile.name,
              pageCount: pdf.numPages,
              parsedAt: new Date().toISOString()
            },
            pages,
            keyValues,
            tables,
            rawText: allLines.join("\n")
          };

          lastJson = result;
          rawTextEl.value = result.rawText;
          jsonOutputEl.textContent = JSON.stringify(result, null, 2);
          downloadBtn.disabled = false;
          setStatus(`解析完成：共 ${pdf.numPages} 页，识别到 ${keyValues.length} 个键值项、${tables.length} 条表格候选行。`);
        } catch (err) {
          console.error(err);
          setStatus(`解析失败：${err.message || err}`);
        } finally {
          parseBtn.disabled = false;
        }
      });

      downloadBtn.addEventListener("click", () => {
        if (!lastJson) return;
        const blob = new Blob([JSON.stringify(lastJson, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${(selectedFile?.name || "parsed").replace(/\.pdf$/i, "")}.structured.json`;
        a.click();
        URL.revokeObjectURL(url);
      });

      function extractKeyValues(lines) {
        const keyValueRegex = /^([^:：]{1,50})[:：]\s*(.+)$/;
        return lines
          .map((line) => {
            const match = line.match(keyValueRegex);
            if (!match) return null;
            return {
              key: match[1].trim(),
              value: match[2].trim(),
              source: line
            };
          })
          .filter(Boolean);
      }

      function extractTableLikeRows(lines) {
        return lines
          .map((line) => {
            const cols = line.split(/\s{2,}|\t|\|/).map((x) => x.trim()).filter(Boolean);
            if (cols.length < 3) return null;
            return { columns: cols, source: line };
          })
          .filter(Boolean);
      }
    </script>
  </body>
</html>
